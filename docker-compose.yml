services:
  postgres:
    image: postgres:16-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_password
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
      - ./rust-backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  wms-postgres-data:
